<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/admin — TheRowKneet</title>
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  body { padding: 40px 20px 80px; }
  .admin-wrap { max-width: 900px; margin: 0 auto; }
  .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 30px; flex-wrap: wrap; }
  .admin-head h1 { font-family: var(--font-m); font-size: 1.3rem; color: var(--lime); }
  .login-box { max-width: 360px; margin: 80px auto; border: 1px solid var(--line); background: var(--bg-2); padding: 30px; border-radius: 8px; }
  .login-box h2 { font-size: 1.2rem; margin-bottom: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-family: var(--font-m); font-size: 0.75rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    padding: 10px 12px; border-radius: 4px; font-family: var(--font-m); font-size: 0.9rem;
  }
  .field textarea { min-height: 90px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--lime); }
  .msg { font-family: var(--font-m); font-size: 0.8rem; margin: 8px 0; min-height: 1.2em; }
  .msg.ok { color: var(--lime); } .msg.err { color: var(--red); }
  .panel { border: 1px solid var(--line); background: var(--bg-2); border-radius: 8px; margin-bottom: 34px; }
  .panel-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-family: var(--font-m); font-size: 0.9rem; color: var(--lime); }
  .panel-body { padding: 20px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px dashed var(--line-soft); padding: 12px 4px; flex-wrap: wrap; }
  .row:last-child { border-bottom: none; }
  .row .r-title { font-weight: 700; }
  .row .r-sub { font-family: var(--font-m); font-size: 0.72rem; color: var(--ink-faint); }
  .row .r-actions { display: flex; gap: 8px; }
  .mini { font-family: var(--font-m); font-size: 0.72rem; border: 1px solid var(--line); background: transparent; color: var(--ink-dim); padding: 5px 10px; border-radius: 3px; cursor: pointer; }
  .mini:hover { border-color: var(--lime); color: var(--lime); }
  .mini.danger:hover { border-color: var(--red); color: var(--red); }
  .mini.warn { border-color: var(--amber); color: var(--amber); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  .hidden { display: none; }
  .up-photo { max-width: 180px; display: block; margin: 8px 0; border: 1px solid var(--line); border-radius: 4px; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="admin-wrap" id="login-view">
  <div class="login-box">
    <h2>/admin<span class="cursor" style="width:6px;height:14px"></span></h2>
    <p style="font-family:var(--font-m);font-size:.8rem;color:var(--ink-faint);margin-bottom:16px">only the builder gets in here.</p>
    <div class="field">
      <label>password</label>
      <input type="password" id="pw" autocomplete="current-password">
    </div>
    <div class="msg" id="login-msg"></div>
    <button class="btn solid" id="login-btn" style="width:100%">unlock</button>
    <p style="margin-top:14px;font-family:var(--font-m);font-size:.72rem;color:var(--ink-faint)"><a href="/">← back to site</a></p>
  </div>
</div>

<div class="admin-wrap hidden" id="admin-view">
  <div class="admin-head">
    <h1>/admin — therowkneet control room</h1>
    <div style="display:flex;gap:10px;align-items:center">
      <a href="/" class="mini">← view site</a>
      <button class="mini danger" id="logout-btn">logout</button>
    </div>
  </div>
  <p class="msg" id="admin-msg"></p>

  <!-- PROJECTS -->
  <section class="panel">
    <div class="panel-head">
      <span>// PROJECTS</span>
      <button class="mini warn" id="new-project-btn">+ new project</button>
    </div>
    <div class="panel-body">
      <div id="project-list"></div>
      <div id="project-form" class="hidden"></div>
    </div>
  </section>

  <!-- ACHIEVEMENTS -->
  <section class="panel">
    <div class="panel-head">
      <span>// WINS & COMPETITIONS</span>
      <button class="mini warn" id="new-ach-btn">+ new win</button>
    </div>
    <div class="panel-body">
      <div id="ach-list"></div>
      <div id="ach-form" class="hidden"></div>
    </div>
  </section>

  <p style="font-family:var(--font-m);font-size:.72rem;color:var(--ink-faint);margin-top:40px">
    tip: change your password in server.js — search for "ADMIN_PASSWORD_HASH". default is <code>build-it-2026</code>.
  </p>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
